[project]
name = "kbc-artifact-hub"
version = "0.7.2"
description = "Keboola App that hosts HTML+JS artifacts under public URLs, backed by Keboola Storage Files"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "kbcstorage>=0.9.0",
    "markdown-it-py>=3.0.0",
    "linkify-it-py>=2.0.0",
    "mdit-py-plugins>=0.4.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
